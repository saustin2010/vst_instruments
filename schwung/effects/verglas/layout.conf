# verglas for MPC, from the Stitch mockup steve/stitch_layouts/verglas.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=6fb6ff
theme_accent_hi=a3d2ff
theme_bg=090c10
theme_box=111720
theme_ink=eef5fc
theme_ink_dim=c3d2e2
theme_ink_faint=6c7f94
theme_knob_dot=a3d2ff
theme_knob_face=eef4fa
theme_knob_ring=1f2a36
theme_lcd=06080b
theme_line=2c3a4c
theme_panel=111720
theme_seg_active=a3d2ff
theme_seg_active_tx=090c10
theme_seg_inactive=1a2330
art_css=verglas.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab VERGLAS]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=101 cy=372 r=32 label="POSITION" key=position strip=images/stitch/knob_0.png frames=64
knob cx=265 cy=372 r=32 label="SIZE" key=size strip=images/stitch/knob_0.png frames=64
knob cx=429 cy=372 r=26 label="PITCH" key=pitch strip=images/stitch/knob_1.png frames=64
knob cx=593 cy=372 r=32 label="DENSITY" key=density strip=images/stitch/knob_0.png frames=64
knob cx=756 cy=372 r=32 label="TEXTURE" key=texture strip=images/stitch/knob_0.png frames=64
knob cx=95 cy=581 r=32 label="DRY/WET" key=dry_wet strip=images/stitch/knob_0.png frames=64
knob cx=247 cy=581 r=26 label="FEEDBACK" key=feedback strip=images/stitch/knob_1.png frames=64
knob cx=399 cy=581 r=26 label="REVERB" key=reverb strip=images/stitch/knob_1.png frames=64
knob cx=551 cy=581 r=26 label="SPREAD" key=stereo_spread strip=images/stitch/knob_1.png frames=64 ns=13 vs=22
knob cx=726 cy=587 r=26 label="HIGH PASS" key=filter_hp strip=images/stitch/knob_1.png frames=64
knob cx=871 cy=587 r=26 label="LOW PASS" key=filter_lp strip=images/stitch/knob_1.png frames=64
enum_h cx=1063 cy=251 label="" key=mode sw=190 sh=32 rows=2
enum_h cx=1165 cy=406 label="" key=quality sw=74 sh=22
toggle cx=1063 cy=343 label="FREEZE" key=freeze
qlinks "VERGLAS" = position,size,pitch,density,texture,mode,freeze,quality,dry_wet,feedback,reverb,stereo_spread,filter_hp,filter_lp

[tab TONE]
art file=images/stitch/bg_1.png x=0 y=86 w=1280 h=628
knob cx=88 cy=234 r=26 label="LOW BOOST" key=low_boost strip=images/stitch/knob_1.png frames=64
knob cx=244 cy=234 r=26 label="LOW FREQ" key=low_freq strip=images/stitch/knob_1.png frames=64
knob cx=400 cy=234 r=26 label="LOW Q" key=low_q strip=images/stitch/knob_1.png frames=64
knob cx=718 cy=234 r=26 label="LIM DRIVE" key=limiter_pre strip=images/stitch/knob_1.png frames=64 ns=15 vs=22
knob cx=874 cy=234 r=26 label="LIM OUTPUT" key=limiter_post strip=images/stitch/knob_1.png frames=64 ns=14 vs=22
toggle cx=562 cy=257 label="LIMITER" key=limiter_on
qlinks "TONE" = low_boost,low_freq,low_q,limiter_on,limiter_pre,limiter_post

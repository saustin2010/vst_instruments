# noisemaker for MPC, from the Stitch mockup steve/stitch_layouts/noisemaker.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
# 2026-10-03 by hand (a rerun of convert.py no longer reproduces this page): BANK stepper under PATCH, in the
# old scope box (bg_0.png repainted there), scope picture shortened (waveforms.py noisemaker osc1_wave --w 592 --h 78).
# Design QA 2026-10-03, also by hand: a Q-Link column per panel (DESIGN-QA.md); OSC's RING MOD moved into the MIXER
# and FX's controls regrouped (reverb 3 + 2, delay level/tone 4 + time 4).

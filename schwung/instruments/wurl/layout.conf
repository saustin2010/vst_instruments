# wurl for MPC, from the Stitch mockup steve/stitch_layouts/wurl.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=b5532b
theme_accent_hi=d4622e
theme_bg=2b1d14
theme_box=efe6d2
theme_ink=2a2018
theme_ink_dim=4a3d30
theme_ink_faint=8a7a62
theme_knob_dot=b5532b
theme_knob_face=efe9dc
theme_knob_ring=6b5a45
theme_lcd=2a2018
theme_line=b9a98a
theme_panel=efe6d2
theme_seg_active=2a2018
theme_seg_active_tx=f3ecdc
theme_seg_inactive=e2d7bf
art_css=wurl.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg
qlink_bounds=column
qlink_box=slot
label_scale=1
focus_ring=1

[tab WURL]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=622 cy=264 r=28 label="BRIGHT" key=brightness strip=images/stitch/knob_0.png frames=64 ns=11 vs=14 bw=78
knob cx=706 cy=264 r=28 label="DARKEN" key=darken strip=images/stitch/knob_0.png frames=64 ns=13 vs=14 bw=78
knob cx=790 cy=264 r=28 label="BARK" key=bark strip=images/stitch/knob_1.png frames=64 ns=17 vs=14 bw=78
knob cx=874 cy=264 r=28 label="TUNE" key=tune strip=images/stitch/knob_0.png frames=64 ns=17 vs=14 bw=78
knob cx=103 cy=521 r=32 label="ATTACK" key=attack strip=images/stitch/knob_2.png frames=64
knob cx=270 cy=521 r=32 label="DECAY" key=decay strip=images/stitch/knob_2.png frames=64
knob cx=438 cy=521 r=32 label="VOLUME" key=volume strip=images/stitch/knob_3.png frames=64
knob cx=917 cy=521 r=32 label="TREMOLO" key=tremolo strip=images/stitch/knob_4.png frames=64
knob cx=1054 cy=521 r=32 label="SPEAKER" key=speaker strip=images/stitch/knob_2.png frames=64
knob cx=1191 cy=521 r=32 label="REVERB" key=reverb strip=images/stitch/knob_2.png frames=64
popup cx=164 cy=226 w=283 h=84 label="" key=preset
qlinks "WURL" = brightness,darken,bark,tune,attack,decay,volume,-,tremolo,speaker,reverb,-,preset,-,-,-

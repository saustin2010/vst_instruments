# monksynth for MPC, from the Stitch mockup steve/stitch_layouts/monksynth.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=d9a63a
theme_accent_hi=f5c451
theme_bg=120a14
theme_display_bg=160e02
theme_display_ink=f5c451
theme_ink=f8eefa
theme_ink_dim=dcc8e0
theme_ink_faint=8c7392
theme_line=4a3352
theme_panel=1d1220
art_css=monksynth.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg


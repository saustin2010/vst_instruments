# mrdrums for MPC, from the Stitch mockup steve/stitch_layouts/mrdrums.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=d23c93
theme_accent_hi=ff5cb8
theme_bg=0d0a0d
theme_box=191219
theme_display_bezel=060406
theme_display_bg=170512
theme_display_cell=270a1f
theme_display_ink=ff5cb8
theme_display_off=3d1030
theme_ink=f8f0f6
theme_ink_dim=d8c3d3
theme_ink_faint=8a6f84
theme_knob_dot=ff5cb8
theme_knob_face=f6eef4
theme_knob_ring=33233a
theme_lcd=090609
theme_line=45304a
theme_panel=191219
theme_seg_active=ff5cb8
theme_seg_active_tx=0d0a0d
theme_seg_inactive=271c27
art_css=mrdrums.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg
qlink_bounds=column
qlink_box=slot
label_scale=1
focus_ring=1

[tab KIT]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=730 cy=326 r=22 label="MASTER VOL" key=g_master_vol strip=images/stitch/knob_0.png frames=64 ns=14 vs=22
knob cx=881 cy=326 r=22 label="POLYPHONY" key=g_polyphony strip=images/stitch/knob_0.png frames=64 ns=15 vs=22
knob cx=1183 cy=326 r=22 label="HUMANIZE" key=g_humanize_ms strip=images/stitch/knob_0.png frames=64
knob cx=1108 cy=524 r=22 label="RAND LOOP" key=g_rand_loop_steps strip=images/stitch/knob_0.png frames=64
enum_v cx=1032 cy=341 label="" key=g_vel_curve sw=74 sh=22
toggle cx=362 cy=493 label="AUTO SELECT" key=ui_auto_select_pad
stepper cx=324 cy=237 w=595 h=68 label="" key=kit get=kit_name style=dotmatrix
stepper cx=324 cy=591 w=595 h=80 label="" key=ui_current_pad style=dotmatrix
qlinks "KIT" = g_master_vol,g_polyphony,g_vel_curve,g_humanize_ms,ui_current_pad,ui_auto_select_pad,-,-,g_rand_loop_steps,-,-,-,kit,-,-,-

[tab PAD]
art file=images/stitch/bg_1.png x=0 y=86 w=1280 h=628
knob cx=445 cy=234 r=22 label="PAD VOLUME" key=pad_vol strip=images/stitch/knob_0.png frames=64
knob cx=681 cy=234 r=22 label="PAD PAN" key=pad_pan strip=images/stitch/knob_0.png frames=64
knob cx=916 cy=234 r=22 label="PAD TUNE" key=pad_tune strip=images/stitch/knob_0.png frames=64
knob cx=1151 cy=234 r=22 label="PAD START" key=pad_start strip=images/stitch/knob_0.png frames=64
knob cx=245 cy=546 r=22 label="CHOKE GROUP" key=pad_choke_group strip=images/stitch/knob_0.png frames=64 ns=12 vs=22
knob cx=402 cy=546 r=22 label="PAD ATTACK" key=pad_attack_ms strip=images/stitch/knob_0.png frames=64 ns=13 vs=22
knob cx=558 cy=546 r=22 label="PAD DECAY" key=pad_decay_ms strip=images/stitch/knob_0.png frames=64 ns=14 vs=22
knob cx=721 cy=546 r=22 label="RAND VOLUME" key=pad_rand_vol_amt strip=images/stitch/knob_0.png frames=64 ns=11 vs=22
knob cx=877 cy=546 r=22 label="RAND PAN" key=pad_rand_pan_amt strip=images/stitch/knob_0.png frames=64 ns=11 vs=22
knob cx=1034 cy=546 r=22 label="RAND DECAY" key=pad_rand_decay_amt strip=images/stitch/knob_0.png frames=64 ns=11 vs=22
knob cx=1190 cy=546 r=22 label="CHANCE" key=pad_chance_pct strip=images/stitch/knob_0.png frames=64 ns=12 vs=22
enum_v cx=89 cy=566 label="" key=pad_mode sw=84 sh=22
stepper cx=166 cy=251 w=270 h=54 label="" key=ui_current_pad style=dotmatrix
qlinks "PAD" = ui_current_pad,-,-,-,pad_vol,pad_pan,pad_tune,pad_start,pad_mode,pad_choke_group,pad_attack_ms,pad_decay_ms,pad_rand_vol_amt,pad_rand_pan_amt,pad_rand_decay_amt,pad_chance_pct

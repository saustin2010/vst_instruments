# tablor for MPC, from the Stitch mockup steve/stitch_layouts/tablor.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=2ec4a6
theme_accent_hi=5ff0cf
theme_bg=05100f
theme_box=0b1c1b
theme_display_bezel=020807
theme_display_bg=031512
theme_display_cell=06221d
theme_display_ink=5ff0cf
theme_display_off=0d3a32
theme_ink=eafffb
theme_ink_dim=bfe9e2
theme_ink_faint=5f9a91
theme_knob_dot=5ff0cf
theme_knob_face=eafffb
theme_knob_ring=143b37
theme_lcd=040b0a
theme_line=21504b
theme_panel=0b1c1b
theme_seg_active=5ff0cf
theme_seg_active_tx=05100f
theme_seg_inactive=123230
art_css=tablor.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab MAIN]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=719 cy=270 r=28 label="WT1 POSITION" key=wt1_pos strip=images/stitch/knob_0.png frames=64
knob cx=872 cy=270 r=28 label="WT1 LEVEL" key=wt1_level strip=images/stitch/knob_0.png frames=64
knob cx=1024 cy=270 r=28 label="WT1 TUNE" key=wt1_tune strip=images/stitch/knob_0.png frames=64
knob cx=1177 cy=270 r=28 label="WT1 UNISON" key=wt1_uni strip=images/stitch/knob_0.png frames=64
knob cx=719 cy=532 r=28 label="WT2 POSITION" key=wt2_pos strip=images/stitch/knob_0.png frames=64
knob cx=872 cy=520 r=28 label="WT2 LEVEL" key=wt2_level strip=images/stitch/knob_0.png frames=64
knob cx=1024 cy=532 r=28 label="WT2 TUNE" key=wt2_tune strip=images/stitch/knob_0.png frames=64
knob cx=1177 cy=532 r=28 label="WT2 UNISON" key=wt2_uni strip=images/stitch/knob_0.png frames=64
stepper cx=331 cy=208 w=600 h=42 label="" key=wt1_select get=wt1_name style=dotmatrix
stepper cx=331 cy=470 w=600 h=42 label="" key=wt2_select get=wt2_name style=dotmatrix
qlinks "MAIN" = wt1_select,-,-,-,wt1_pos,wt1_level,wt1_tune,wt1_uni,wt2_select,-,-,-,wt2_pos,wt2_level,wt2_tune,wt2_uni


# nusaw for MPC, from the Stitch mockup steve/stitch_layouts/nusaw.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=19c6e6
theme_accent_hi=4fe6ff
theme_bg=07060d
theme_box=110f1c
theme_display_bezel=030308
theme_display_bg=02101a
theme_display_cell=051c2a
theme_display_ink=4fe6ff
theme_display_off=0a2b3f
theme_ink=f1efff
theme_ink_dim=c6c1ea
theme_ink_faint=6f6a99
theme_knob_dot=4fe6ff
theme_knob_face=eef0ff
theme_knob_ring=221f3d
theme_lcd=05040a
theme_line=2f2a52
theme_panel=110f1c
theme_seg_active=4fe6ff
theme_seg_active_tx=07060d
theme_seg_inactive=1c1930
art_css=nusaw.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg
qlink_bounds=column
qlink_box=slot
label_scale=1
focus_ring=1

[tab MAIN]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=734 cy=240 r=32 label="SAWS" key=saw_count strip=images/stitch/knob_0.png frames=64
knob cx=882 cy=240 r=32 label="DETUNE" key=detune strip=images/stitch/knob_1.png frames=64
knob cx=1032 cy=240 r=32 label="SPREAD" key=spread strip=images/stitch/knob_2.png frames=64
knob cx=1180 cy=240 r=32 label="SUB LEVEL" key=sub_level strip=images/stitch/knob_3.png frames=64
knob cx=375 cy=538 r=48 label="CUTOFF" key=cutoff strip=images/stitch/knob_4.png frames=64 ns=16 vs=16 bw=106
knob cx=473 cy=538 r=36 label="RESONANCE" key=resonance strip=images/stitch/knob_5.png frames=64 ns=11 vs=14 bw=82
knob cx=559 cy=538 r=36 label="ENV MOD" key=f_amount strip=images/stitch/knob_6.png frames=64 ns=11 vs=14 bw=82
slider_v cx=740 cy=550 w=12 h=189 label="ATTACK" key=attack bw=138
slider_v cx=884 cy=550 w=12 h=189 label="DECAY" key=decay bw=138
slider_v cx=1030 cy=550 w=12 h=189 label="SUSTAIN" key=sustain bw=138
slider_v cx=1174 cy=550 w=12 h=189 label="RELEASE" key=release bw=138
stepper cx=474 cy=266 w=302 h=60 label="" key=preset get=preset_name style=dotmatrix
qlinks "MAIN" = saw_count,detune,spread,sub_level,cutoff,resonance,f_amount,-,attack,decay,sustain,release,preset,-,-,-


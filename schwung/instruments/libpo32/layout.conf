knob cx=1114 cy=384 r=32 label="DISTORTION" key=inst_dist strip=images/stitch/knob_1.png frames=64 bw=74
knob cx=1114 cy=500 r=32 label="PAD LEVEL" key=inst_level strip=images/stitch/knob_1.png frames=64 bw=74
enum_h cx=166 cy=334 label="" key=inst_wave sw=90 sh=25
enum_h cx=482 cy=392 label="" key=inst_mod_mode sw=90 sh=25
enum_h cx=798 cy=347 label="" key=inst_noise_filt sw=90 sh=25
enum_h cx=798 cy=560 label="" key=inst_noise_env sw=44 sh=25
popup cx=464 cy=184 w=575 h=40 label="" key=inst
qlinks "EDIT" = inst_wave,inst_freq,inst_dcy,-,inst_mod_mode,inst_mod_amt,-,-,inst_noise_filt,inst_noise,inst_noise_env,-,inst_dist,inst_level,-,-


knob cx=166 cy=414 r=32 label="BASE PITCH" key=inst_freq strip=images/stitch/knob_1.png frames=64 bw=74
knob cx=166 cy=530 r=32 label="OSC DECAY" key=inst_dcy strip=images/stitch/knob_1.png frames=64 bw=74
knob cx=482 cy=472 r=32 label="MOD AMOUNT" key=inst_mod_amt strip=images/stitch/knob_1.png frames=64

# libpo32 for MPC, from the Stitch mockup steve/stitch_layouts/libpo32.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=d9b43c
theme_accent_hi=f2cf55
theme_bg=071f19
theme_ink=f1faf5
theme_ink_dim=c3e2d4
theme_ink_faint=6fa08c
theme_knob_face=0b261f
theme_knob_ring=1c4a3d
theme_lcd=a9b39a
theme_lcd_bezel=0a0d08
theme_lcd_ink=1a1f14
theme_line=2a6a55
theme_panel=0d3128
theme_panel_light=134438
art_css=libpo32.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab KIT]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=808 cy=291 r=32 label="LEVEL" key=level strip=images/stitch/knob_0.png frames=64
knob cx=1104 cy=291 r=32 label="DECAY SCALE" key=decay strip=images/stitch/knob_0.png frames=64
button cx=546 cy=254 label="RANDOM KIT" key=randomize
button cx=546 cy=364 label="SAVE KIT" key=save_kit
slider_v cx=100 cy=574 w=8 h=140 label="01: KICK" key=v01_lvl
slider_v cx=254 cy=574 w=8 h=140 label="02: SNARE" key=v02_lvl
slider_v cx=409 cy=574 w=8 h=140 label="03: CLAVE" key=v03_lvl
slider_v cx=563 cy=574 w=8 h=140 label="04: TOM" key=v04_lvl
slider_v cx=717 cy=574 w=8 h=140 label="05: HAT CL" key=v05_lvl
slider_v cx=871 cy=574 w=8 h=140 label="06: HAT OP" key=v06_lvl
slider_v cx=1026 cy=574 w=8 h=140 label="07: CYMB" key=v07_lvl
slider_v cx=1180 cy=574 w=8 h=140 label="08: NOISE" key=v08_lvl
stepper cx=241 cy=295 w=428 h=80 label="" key=kit get=kit_name style=dotmatrix
qlinks "KIT" = level,decay,-,-,v01_lvl,v02_lvl,v03_lvl,v04_lvl,v05_lvl,v06_lvl,v07_lvl,v08_lvl,kit,-,-,-


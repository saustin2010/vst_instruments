# 303 for MPC, from the Stitch mockup steve/stitch_layouts/303.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=d9531e
theme_accent_hi=f0621f
theme_bg=aeb1b4
theme_box=d3d5d6
theme_ink=17181b
theme_ink_dim=34373c
theme_ink_faint=5f6369
theme_knob_dot=d9531e
theme_knob_face=e9e7e0
theme_knob_ring=7d8085
theme_lcd=1b1c1f
theme_line=8e9196
theme_panel=d3d5d6
theme_seg_active=1c1d20
theme_seg_active_tx=f3f3f1
theme_seg_inactive=e3e4e5
art_css=303.css
qlink_bounds=column
label_scale=1
focus_ring=1
qlink_box=slot
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab 303 MAIN]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=238 cy=259 r=38 label="TUNING" key=tuning strip=images/stitch/knob_0.png frames=64
knob cx=418 cy=259 r=46 label="CUTOFF" key=cutoff strip=images/stitch/knob_1.png frames=64
knob cx=565 cy=259 r=38 label="RESONANCE" key=resonance strip=images/stitch/knob_0.png frames=64 ns=16 vs=22
knob cx=703 cy=259 r=38 label="ENV MOD" key=env_mod strip=images/stitch/knob_0.png frames=64
knob cx=841 cy=259 r=38 label="DECAY" key=decay strip=images/stitch/knob_0.png frames=64
knob cx=1014 cy=259 r=38 label="ACCENT" key=accent strip=images/stitch/knob_0.png frames=64
knob cx=1186 cy=259 r=38 label="VOLUME" key=volume strip=images/stitch/knob_0.png frames=64
knob cx=306 cy=527 r=38 label="DRIVE" key=drive strip=images/stitch/knob_0.png frames=64
knob cx=490 cy=527 r=38 label="DRIVE MIX" key=drive_mix strip=images/stitch/knob_0.png frames=64
knob cx=678 cy=527 r=38 label="SHAPER DRIVE" key=tanh_shaper_drive strip=images/stitch/knob_0.png frames=64 ns=12 vs=22
enum_v cx=97 cy=269 label="" key=waveform sw=80 sh=31
enum_v cx=120 cy=537 label="" key=drive_model sw=80 sh=31

# Build a DRAFT release (tag v<version>) with mpc-vst-plugins' shared workflow: Actions -> "Release (draft)" -> Run
# workflow. Then install that draft's zip on a device, smoke-test it and publish the draft (mpc-vst-plugins
# docs/RELEASING.md). dry_run builds the zip and skin previews as run artifacts only.
# The tools come from saustin2010/mpc-vst-plugins (sd88me's repo plus changes offered to it) until they're merged there:
# then point uses: and tools_ref at sd88me/mpc-vst-plugins and drop tools_repo.
# This plugin is developed in saustin2010/vst_instruments (schwung/instruments/chordism) and published here.
name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: saustin2010/mpc-vst-plugins/.github/workflows/vst-release.yml@9595071449a2e6ee09049d1a3ce6d78357091189
    permissions:
      contents: write
    with:
      tag: v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_repo: saustin2010/mpc-vst-plugins
      tools_ref: 9595071449a2e6ee09049d1a3ce6d78357091189
      vst_dir: .
      build: bash "$MPC_VST/tools/build_port.sh" vst.json
      host_test: '"$MPC_VST/tools/test_port.sh" vst.json'
      plugin_id: chordism
      license: MIT
      about: "One key in, a four-voice chord out: morphing oscillators, FM, filter, lo-fi, delay, reverb and an arpeggiator."
      dry_run: ${{ inputs.dry_run }}

# plaits for MPC, from the Stitch mockup steve/stitch_layouts/plaits.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=5fc44a
theme_accent_hi=8ae673
theme_bg=0d0f0e
theme_box=171a18
theme_display_bezel=040604
theme_display_bg=071207
theme_display_cell=0d200d
theme_display_ink=8ae673
theme_display_off=163416
theme_ink=f1f5f2
theme_ink_dim=c9d2cc
theme_ink_faint=77847b
theme_knob_dot=8ae673
theme_knob_face=eef2ef
theme_knob_ring=29302b
theme_lcd=080a09
theme_line=3a423d
theme_panel=171a18
theme_seg_active=8ae673
theme_seg_active_tx=0d0f0e
theme_seg_inactive=222824
art_css=plaits.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab PLAITS]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=164 cy=346 r=32 label="OCTAVE" key=octave_transpose strip=images/stitch/knob_0.png frames=64
knob cx=501 cy=290 r=48 label="HARMONICS" key=harmonics strip=images/stitch/knob_1.png frames=64
knob cx=799 cy=290 r=48 label="TIMBRE" key=timbre strip=images/stitch/knob_1.png frames=64
knob cx=1096 cy=290 r=48 label="MORPH" key=morph strip=images/stitch/knob_1.png frames=64
knob cx=101 cy=558 r=32 label="LPG DECAY" key=decay strip=images/stitch/knob_0.png frames=64
knob cx=270 cy=558 r=32 label="LPG COLOUR" key=lpg_colour strip=images/stitch/knob_0.png frames=64
knob cx=438 cy=558 r=32 label="ATTACK" key=attack strip=images/stitch/knob_0.png frames=64
knob cx=637 cy=558 r=32 label="FM" key=fm_amount strip=images/stitch/knob_0.png frames=64
knob cx=815 cy=558 r=32 label="TIMBRE MOD" key=timbre_mod strip=images/stitch/knob_0.png frames=64
knob cx=994 cy=558 r=32 label="MORPH MOD" key=morph_mod strip=images/stitch/knob_0.png frames=64
knob cx=1172 cy=558 r=32 label="AUX MIX" key=aux_mix strip=images/stitch/knob_0.png frames=64
popup cx=164 cy=264 w=282 h=84 label="" key=engine
qlinks "PLAITS" = engine,octave_transpose,-,-,harmonics,timbre,morph,-,decay,lpg_colour,attack,-,fm_amount,timbre_mod,morph_mod,aux_mix

[tab PLAY]
art file=images/stitch/bg_1.png x=0 y=86 w=1280 h=628
knob cx=955 cy=225 r=40 label="VELOCITY" key=velocity_sensitivity strip=images/stitch/knob_2.png frames=64 ns=12 vs=22
knob cx=1163 cy=225 r=40 label="VOLUME" key=volume strip=images/stitch/knob_2.png frames=64
toggle cx=746 cy=258 label="LEGATO" key=legato
stepper cx=323 cy=250 w=580 h=70 label="" key=fm_preset_index get=fm_preset style=dotmatrix
qlinks "PLAY" = fm_preset_index,-,-,-,legato,velocity_sensitivity,volume,-

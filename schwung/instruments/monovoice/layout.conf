# monovoice for MPC, from the Stitch mockup steve/stitch_layouts/monovoice.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=e8a228
theme_accent_hi=ffbf47
theme_bg=121212
theme_box=1d1d1d
theme_ink=f2f2f2
theme_ink_dim=cfcfcf
theme_ink_faint=7d7d7d
theme_knob_dot=ffbf47
theme_knob_face=f2f2f2
theme_knob_ring=2e2e2e
theme_lcd=0a0a0a
theme_line=444444
theme_panel=1d1d1d
theme_seg_active=ffbf47
theme_seg_active_tx=121212
theme_seg_inactive=2a2a2a
art_css=monovoice.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab MACHINE]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
stepper cx=223 cy=648 w=393 h=46 label="" key=lfo1_1 style=dotmatrix
stepper cx=640 cy=648 w=393 h=46 label="" key=lfo2_1 style=dotmatrix
stepper cx=1057 cy=648 w=393 h=46 label="" key=lfo3_1 style=dotmatrix
popup cx=173 cy=179 w=294 h=40 label="" key=machine
qlinks "MACHINE" = machine,lfo1_1,lfo2_1,lfo3_1


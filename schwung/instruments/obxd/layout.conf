# obxd for MPC, from the Stitch mockup steve/stitch_layouts/obxd.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=d63a2b
theme_accent_hi=ff5646
theme_bg=0e0f11
theme_box=17181b
theme_display_bezel=060606
theme_display_bg=140504
theme_display_cell=240a08
theme_display_ink=ff4d3b
theme_display_off=361009
theme_ink=f3f2ee
theme_ink_dim=c3c5c8
theme_ink_faint=6d7076
theme_knob_dot=ff5646
theme_knob_face=e9e7e0
theme_knob_ring=2b2d31
theme_lcd=0b0b0c
theme_line=393b41
theme_panel=17181b
theme_seg_active=eeede8
theme_seg_active_tx=101113
theme_seg_inactive=222327
art_css=obxd.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab MAIN]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=755 cy=320 r=28 label="VOLUME" key=volume strip=images/stitch/knob_0.png frames=64
knob cx=949 cy=320 r=28 label="TUNE" key=tune strip=images/stitch/knob_1.png frames=64
knob cx=94 cy=578 r=24 label="VOICES" key=voice_count strip=images/stitch/knob_2.png frames=64 ns=14 vs=22
knob cx=232 cy=578 r=24 label="SPREAD" key=unison_det strip=images/stitch/knob_2.png frames=64 ns=15 vs=22 bw=104
knob cx=866 cy=578 r=28 label="PORTAMENTO" key=portamento strip=images/stitch/knob_3.png frames=64
enum_h cx=496 cy=598 label="" key=legato sw=106 sh=26 rows=2
toggle cx=347 cy=546 label="UNISON" key=unison
toggle cx=347 cy=628 label="AS PLAYED" key=as_played
toggle cx=1051 cy=600 label="BEND 12" key=bend_range
toggle cx=1173 cy=600 label="BEND OSC2" key=bend_osc2
stepper cx=324 cy=264 w=600 h=48 label="" key=preset get=preset_name style=dotmatrix
stepper cx=348 cy=319 w=544 h=40 label="" key=bank_index get=bank_name style=dotmatrix
qlinks "MAIN" = preset,volume,tune,voice_count,unison_det,unison,as_played,legato,portamento,bend_range,bend_osc2,bank_index


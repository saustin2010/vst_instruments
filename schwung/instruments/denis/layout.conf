toggle cx=1172 cy=560 label="LEGATO" key=legato
button cx=254 cy=318 label="RANDOM ALL" key=rnd_patch
popup cx=272 cy=266 w=189 h=40 label="" key=preset
qlinks "DENIS" = osc1_freq,osc1_timbre,-,-,osc2_pitch,osc2_harmonics,osc_mix,-,fold_depth,fold_type,filter_cutoff,filter_q,vel_to_filter,portamento,legato,-


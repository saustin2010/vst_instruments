# denis for MPC, from the Stitch mockup steve/stitch_layouts/denis.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=2f9fd8
theme_accent_hi=f0c020
theme_bg=0c0c0c
theme_box=151515
theme_ink=f0f0ea
theme_ink_dim=c8c8c0
theme_ink_faint=7a7a72
theme_knob_dot=f0c020
theme_knob_face=f0f0ea
theme_knob_ring=2a2a2a
theme_lcd=080808
theme_line=3a3a3a
theme_panel=151515
theme_seg_active=f0c020
theme_seg_active_tx=0c0c0c
theme_seg_inactive=222222
art_css=denis.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg
qlink_bounds=column
qlink_box=slot
label_scale=1
focus_ring=1

[tab DENIS]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=584 cy=274 r=37 label="OSC1 FREQ" key=osc1_freq strip=images/stitch/knob_0.png frames=64
knob cx=732 cy=274 r=37 label="OSC1 TIMBRE" key=osc1_timbre strip=images/stitch/knob_0.png frames=64 ns=14 vs=22

art_css=superarp.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab MAIN]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=526 cy=228 r=28 label="TEMPO (BPM)" key=bpm strip=images/stitch/knob_0.png frames=64
knob cx=546 cy=493 r=28 label="GATE" key=gate strip=images/stitch/knob_1.png frames=64
knob cx=750 cy=493 r=28 label="VELOCITY" key=velocity strip=images/stitch/knob_2.png frames=64
knob cx=954 cy=493 r=28 label="SWING" key=swing strip=images/stitch/knob_3.png frames=64
knob cx=1159 cy=493 r=28 label="VOICES" key=max_voices strip=images/stitch/knob_4.png frames=64
enum_v cx=93 cy=246 label="" key=sync sw=130 sh=22
enum_v cx=246 cy=251 label="" key=rate sw=130 sh=22
toggle cx=373 cy=246 label="TRIPLET" key=triplet
toggle cx=115 cy=511 label="LATCH STATE" key=latch
popup cx=323 cy=511 w=134 h=48 label="" key=octave_range
qlinks "MAIN" = sync,rate,triplet,bpm,latch,octave_range,gate,velocity,swing,max_voices


# superarp for MPC, from the Stitch mockup steve/stitch_layouts/superarp.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=a764e8
theme_accent_hi=c993ff
theme_bg=0e0a12
theme_box=18121e
theme_display_bezel=060408
theme_display_bg=0d0716
theme_display_cell=1a0f2a
theme_display_ink=c993ff
theme_display_off=2a1a40
theme_ink=f6effc
theme_ink_dim=d5c7e3
theme_ink_faint=7f6d92
theme_knob_dot=c993ff
theme_knob_face=f6effc
theme_knob_ring=2b2236
theme_lcd=08060a
theme_line=3f3150
theme_panel=18121e
theme_seg_active=c993ff
theme_seg_active_tx=0e0a12

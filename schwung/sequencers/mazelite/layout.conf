# mazelite for MPC, from the Stitch mockup steve/stitch_layouts/mazelite.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=e8d23a
theme_accent_hi=fff066
theme_bg=0c0c0c
theme_box=171717
theme_ink=f4f4f4
theme_ink_dim=cfcfcf
theme_ink_faint=7a7a7a
theme_knob_dot=fff066
theme_knob_face=f4f4f4
theme_knob_ring=2a2a2a
theme_lcd=070707
theme_line=3d3d3d
theme_panel=171717
theme_seg_active=fff066
theme_seg_active_tx=0c0c0c
theme_seg_inactive=262626
art_css=mazelite.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab MAZE]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=144 cy=562 r=22 label="S1 CORRUPT" key=s1_corrupt strip=images/stitch/knob_0.png frames=64 ns=11 vs=14 bw=58
knob cx=208 cy=562 r=22 label="S1 RANGE" key=s1_cv_range strip=images/stitch/knob_1.png frames=64 ns=11 vs=14 bw=58
knob cx=274 cy=562 r=22 label="S1 LENGTH" key=s1_length strip=images/stitch/knob_2.png frames=64 ns=11 vs=14 bw=60
knob cx=343 cy=562 r=22 label="S1 TRIG MIX" key=trig_mix strip=images/stitch/knob_3.png frames=64 ns=11 vs=14 bw=63
knob cx=935 cy=562 r=22 label="S2 CORRUPT" key=s2_corrupt strip=images/stitch/knob_4.png frames=64 ns=11 vs=14 bw=58
knob cx=999 cy=562 r=22 label="S2 RANGE" key=s2_cv_range strip=images/stitch/knob_5.png frames=64 ns=11 vs=14 bw=58
knob cx=1065 cy=562 r=22 label="S2 LENGTH" key=s2_length strip=images/stitch/knob_6.png frames=64 ns=11 vs=14 bw=60
knob cx=1134 cy=562 r=22 label="S2 TRIG MIX" key=trig_mix_b strip=images/stitch/knob_7.png frames=64 ns=11 vs=14 bw=63
button cx=97 cy=468 label="S1 FLIP" key=s1_bit_flip
button cx=248 cy=468 label="S1 STEP" key=s1_advance
button cx=399 cy=468 label="S2 FLIP" key=s2_bit_flip
button cx=550 cy=468 label="S2 STEP" key=s2_advance
popup cx=97 cy=214 w=129 h=40 label="" key=scale
popup cx=248 cy=214 w=129 h=40 label="" key=note_rate
popup cx=399 cy=214 w=129 h=40 label="" key=note_length
popup cx=543 cy=211 w=130 h=40 label="" key=g_reset
popup cx=808 cy=468 w=130 h=40 label="" key=s1_reset
popup cx=1105 cy=468 w=130 h=40 label="" key=s2_reset
qlinks "MAZE" = scale,note_rate,note_length,g_reset,s1_reset,s2_reset,s1_corrupt,s1_cv_range,s1_length,trig_mix,s2_corrupt,s2_cv_range,s2_length,trig_mix_b

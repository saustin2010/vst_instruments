# pixelwalkers for MPC, from the Stitch mockup steve/stitch_layouts/pixelwalkers.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=ff4fa3
theme_accent_hi=ff7cc0
theme_bg=0a0a14
theme_box=13132a
theme_ink=f0f0ff
theme_ink_dim=c8c8f0
theme_ink_faint=7474a8
theme_knob_dot=ff7cc0
theme_knob_face=f0f0ff
theme_knob_ring=232345
theme_lcd=06060c
theme_line=34345e
theme_panel=13132a
theme_seg_active=ff7cc0
theme_seg_active_tx=0a0a14
theme_seg_inactive=20203d
art_css=pixelwalkers.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab MAIN]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=300 cy=245 r=22 label="BIRTH LEVEL" key=birth_level strip=images/stitch/knob_0.png frames=64 ns=15 vs=22
knob cx=450 cy=245 r=22 label="HIT LEVEL" key=hit_level strip=images/stitch/knob_1.png frames=64
knob cx=595 cy=245 r=22 label="HIT DECAY" key=hit_decay strip=images/stitch/knob_1.png frames=64
knob cx=709 cy=590 r=20 label="BOUNCE" key=bounce strip=images/stitch/knob_2.png frames=64 ns=17 vs=19 bw=110
knob cx=825 cy=590 r=20 label="HARDNESS" key=hardness strip=images/stitch/knob_2.png frames=64 ns=15 vs=19 bw=110
knob cx=941 cy=590 r=20 label="TOMBOLA" key=tombola strip=images/stitch/knob_2.png frames=64 ns=16 vs=19 bw=110
toggle cx=66 cy=254 label="BIRTH NOTE" key=birth_note
button cx=1142 cy=560 label="RANDOMIZE" key=randomize
button cx=1142 cy=608 label="KILL ALL" key=kill_all
qlinks "MAIN" = birth_note,birth_level,hit_level,hit_decay,bounce,hardness,tombola,randomize,kill_all

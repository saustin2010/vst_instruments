# warps for MPC, from the Stitch mockup steve/stitch_layouts/warps.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=35b6d6
theme_accent_hi=68d8f2
theme_bg=0a0e10
theme_box=12191c
theme_ink=eef8fa
theme_ink_dim=c3d8dd
theme_ink_faint=6d868d
theme_knob_dot=68d8f2
theme_knob_face=eef5f7
theme_knob_ring=20303a
theme_lcd=060a0b
theme_line=2c4148
theme_panel=12191c
theme_seg_active=68d8f2
theme_seg_active_tx=0a0e10
theme_seg_inactive=1a272b
art_css=warps.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab WARPS]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=122 cy=238 r=37 label="ALGORITHM" key=algorithm strip=images/stitch/knob_0.png frames=64
knob cx=324 cy=238 r=37 label="TIMBRE" key=timbre strip=images/stitch/knob_1.png frames=64
knob cx=526 cy=238 r=30 label="SHIFT" key=shift strip=images/stitch/knob_2.png frames=64
knob cx=754 cy=238 r=30 label="NOTE" key=note strip=images/stitch/knob_2.png frames=64
knob cx=956 cy=238 r=30 label="FINE" key=fine strip=images/stitch/knob_2.png frames=64
knob cx=1158 cy=238 r=30 label="CARRIER LVL" key=level_1 strip=images/stitch/knob_2.png frames=64
knob cx=113 cy=538 r=30 label="MOD LEVEL" key=level_2 strip=images/stitch/knob_2.png frames=64
knob cx=314 cy=534 r=30 label="MIX" key=mix strip=images/stitch/knob_2.png frames=64
knob cx=479 cy=534 r=30 label="VOLUME" key=volume strip=images/stitch/knob_2.png frames=64
enum_h cx=539 cy=170 label="" key=mode sw=94 sh=22 options="META MOD,FREQ"
enum_h cx=1139 cy=170 label="" key=carrier sw=54 sh=22 options="EXT,SINE,TRI,SAW"
enum_h cx=520 cy=480 label="" key=output sw=104 sh=22
qlinks "WARPS" = mode,algorithm,timbre,shift,carrier,note,fine,level_1,level_2,-,-,-,output,mix,volume,-

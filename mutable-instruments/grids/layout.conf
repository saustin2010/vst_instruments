# grids for MPC, from the Stitch mockup steve/stitch_layouts/grids.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=e0463c
theme_accent_hi=ff6b5f
theme_bg=100c0c
theme_box=1b1414
theme_ink=fbf0f0
theme_ink_dim=e0caca
theme_ink_faint=8c7070
theme_knob_dot=ff6b5f
theme_knob_face=f4eeee
theme_knob_ring=332424
theme_lcd=0a0707
theme_line=4a3131
theme_panel=1b1414
theme_seg_active=ff6b5f
theme_seg_active_tx=100c0c
theme_seg_inactive=2c1f1f
art_css=grids.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab GRIDS]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=269 cy=282 r=23 label="MAP X" key=map_x strip=images/stitch/knob_0.png frames=64 ns=17 vs=16 bw=94
knob cx=369 cy=282 r=23 label="MAP Y" key=map_y strip=images/stitch/knob_0.png frames=64 ns=17 vs=16 bw=94
knob cx=470 cy=282 r=23 label="CHAOS" key=chaos strip=images/stitch/knob_0.png frames=64 ns=17 vs=16 bw=95
knob cx=626 cy=280 r=21 label="BD FILL" key=bd_fill strip=images/stitch/knob_1.png frames=64 bw=123
knob cx=755 cy=280 r=21 label="SD FILL" key=sd_fill strip=images/stitch/knob_1.png frames=64 bw=123
knob cx=884 cy=280 r=21 label="HH FILL" key=hh_fill strip=images/stitch/knob_1.png frames=64 bw=123
knob cx=930 cy=526 r=21 label="BD LEN" key=len_bd strip=images/stitch/knob_1.png frames=64
knob cx=1061 cy=526 r=21 label="SD LEN" key=len_sd strip=images/stitch/knob_1.png frames=64
knob cx=1193 cy=526 r=21 label="HH LEN" key=len_hh strip=images/stitch/knob_1.png frames=64
enum_h cx=1114 cy=271 label="" key=mode sw=134 sh=26

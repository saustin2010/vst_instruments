# marbles for MPC, from the Stitch mockup steve/stitch_layouts/marbles.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=8f6ae0
theme_accent_hi=b394ff
theme_bg=0e0c12
theme_box=18151f
theme_ink=f4f0fb
theme_ink_dim=d2c9e3
theme_ink_faint=7d7092
theme_knob_dot=b394ff
theme_knob_face=f1eef6
theme_knob_ring=2a2436
theme_lcd=08060b
theme_line=3d3550
theme_panel=18151f
theme_seg_active=b394ff
theme_seg_active_tx=0e0c12
theme_seg_inactive=241f30
art_css=marbles.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab MARBLES]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=580 cy=203 r=46 label="T BIAS" key=t_bias strip=images/stitch/knob_0.png frames=64 ns=13 vs=14 bw=102
knob cx=662 cy=181 r=24 label="JITTER" key=jitter strip=images/stitch/knob_1.png frames=64 ns=13 vs=14 bw=76
knob cx=827 cy=190 r=46 label="DEJA VU" key=deja_vu strip=images/stitch/knob_0.png frames=64 ns=16 vs=18 bw=107
knob cx=940 cy=190 r=28 label="LENGTH" key=length strip=images/stitch/knob_2.png frames=64 ns=17 vs=18 bw=107
knob cx=392 cy=513 r=46 label="SPREAD" key=spread strip=images/stitch/knob_0.png frames=64 ns=13 vs=14 bw=102
knob cx=474 cy=491 r=24 label="X BIAS" key=x_bias strip=images/stitch/knob_1.png frames=64 ns=13 vs=14 bw=76
knob cx=631 cy=491 r=24 label="STEPS" key=steps strip=images/stitch/knob_1.png frames=64
knob cx=1142 cy=489 r=28 label="GATE LEN" key=gate_len strip=images/stitch/knob_2.png frames=64
enum_v cx=1055 cy=218 label="" key=t_deja_vu sw=96 sh=24
enum_v cx=895 cy=511 label="" key=channels sw=124 sh=22
enum_v cx=1189 cy=223 label="" key=x_deja_vu sw=96 sh=22
toggle cx=845 cy=615 label="T1 > X1" key=t1_out
toggle cx=1009 cy=615 label="T2 > X2" key=t2_out
toggle cx=1174 cy=615 label="T3 > X3" key=t3_out
popup cx=573 cy=118 w=125 h=40 label="" key=t_model
popup cx=686 cy=118 w=110 h=40 label="" key=clock_div
popup cx=646 cy=428 w=165 h=40 label="" key=scale
qlinks "MARBLES" = t_model,clock_div,t_bias,jitter,deja_vu,length,t_deja_vu,x_deja_vu,scale,spread,x_bias,steps,channels,gate_len,-,-

[tab SETUP]
art file=images/stitch/bg_1.png x=0 y=86 w=1280 h=628
knob cx=401 cy=230 r=28 label="GATE RAND" key=gate_rand strip=images/stitch/knob_2.png frames=64

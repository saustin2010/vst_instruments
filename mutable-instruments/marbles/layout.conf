knob cx=1035 cy=230 r=28 label="VELOCITY" key=velocity strip=images/stitch/knob_2.png frames=64
enum_v cx=89 cy=260 label="" key=rate_base sw=114 sh=22
enum_v cx=245 cy=260 label="" key=t_range sw=64 sh=22
enum_v cx=562 cy=260 label="" key=x_range sw=114 sh=22
enum_v cx=717 cy=260 label="" key=x_mode sw=104 sh=22

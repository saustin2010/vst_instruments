knob cx=716 cy=268 r=38 label="BLOW TIMBRE" key=blow_timbre strip=images/stitch/knob_0.png frames=64 ns=14 vs=22
knob cx=893 cy=268 r=38 label="STRIKE" key=strike strip=images/stitch/knob_0.png frames=64
knob cx=1034 cy=268 r=38 label="MALLET" key=mallet strip=images/stitch/knob_0.png frames=64

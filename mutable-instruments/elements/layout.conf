# elements for MPC, from the Stitch mockup steve/stitch_layouts/elements.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=2fb8ad
theme_accent_hi=5ee0d4
theme_bg=0b0f0f
theme_box=131a1a
theme_ink=eef8f7
theme_ink_dim=c4d8d6
theme_ink_faint=6f8886
theme_knob_dot=5ee0d4
theme_knob_face=eef5f4
theme_knob_ring=243231
theme_lcd=070a0a
theme_line=2f4544
theme_panel=131a1a
theme_seg_active=5ee0d4
theme_seg_active_tx=0b0f0f
theme_seg_inactive=1d2928
art_css=elements.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg
qlink_bounds=column
qlink_box=slot
label_scale=1
focus_ring=1

[tab ELEMENTS]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=104 cy=268 r=38 label="BOW" key=bow strip=images/stitch/knob_0.png frames=64

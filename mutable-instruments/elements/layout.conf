# elements for MPC, from the Stitch mockup steve/stitch_layouts/elements.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=2fb8ad
theme_accent_hi=5ee0d4
theme_bg=0b0f0f
theme_box=131a1a
theme_ink=eef8f7
theme_ink_dim=c4d8d6
theme_ink_faint=6f8886
theme_knob_dot=5ee0d4
theme_knob_face=eef5f4
theme_knob_ring=243231
theme_lcd=070a0a
theme_line=2f4544
theme_panel=131a1a
theme_seg_active=5ee0d4
theme_seg_active_tx=0b0f0f
theme_seg_inactive=1d2928
art_css=elements.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg
qlink_bounds=column
qlink_box=slot
label_scale=1
focus_ring=1

[tab MODAL VOICE]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=94 cy=237 r=38 label="BOW" key=bow strip=images/stitch/knob_0.png frames=64
knob cx=236 cy=237 r=38 label="BOW TIMBRE" key=bow_timbre strip=images/stitch/knob_0.png frames=64 ns=15 vs=22
knob cx=412 cy=237 r=38 label="BLOW" key=blow strip=images/stitch/knob_0.png frames=64
knob cx=557 cy=237 r=38 label="FLOW" key=flow strip=images/stitch/knob_0.png frames=64
knob cx=706 cy=237 r=38 label="BLOW TIMBRE" key=blow_timbre strip=images/stitch/knob_0.png frames=64 ns=14 vs=22
knob cx=883 cy=237 r=38 label="STRIKE" key=strike strip=images/stitch/knob_0.png frames=64
knob cx=1024 cy=237 r=38 label="MALLET" key=mallet strip=images/stitch/knob_0.png frames=64
knob cx=1166 cy=237 r=38 label="STRK TIMBRE" key=strike_timbre strip=images/stitch/knob_0.png frames=64 ns=12 vs=22
knob cx=86 cy=536 r=38 label="CONTOUR" key=contour strip=images/stitch/knob_0.png frames=64
knob cx=428 cy=536 r=38 label="GEOMETRY" key=geometry strip=images/stitch/knob_0.png frames=64
knob cx=628 cy=536 r=38 label="BRIGHTNESS" key=brightness strip=images/stitch/knob_0.png frames=64
knob cx=829 cy=536 r=38 label="DAMPING" key=damping strip=images/stitch/knob_0.png frames=64
knob cx=1029 cy=536 r=38 label="POSITION" key=position strip=images/stitch/knob_0.png frames=64
knob cx=1180 cy=536 r=38 label="SPACE" key=space strip=images/stitch/knob_0.png frames=64
enum_v cx=236 cy=555 label="" key=model sw=84 sh=24
qlinks "MODAL VOICE 1" = bow,bow_timbre,-,-,blow,flow,blow_timbre,-,strike,mallet,strike_timbre,-,geometry,brightness,damping,position
qlinks "MODAL VOICE 2" = contour,-,-,-,model,-,-,-,space,-,-,-

[tab PLAY]
art file=images/stitch/bg_1.png x=0 y=86 w=1280 h=628
knob cx=94 cy=237 r=38 label="OCTAVE" key=octave strip=images/stitch/knob_0.png frames=64
knob cx=235 cy=237 r=38 label="FINE" key=fine strip=images/stitch/knob_0.png frames=64
knob cx=376 cy=237 r=38 label="BEND RANGE" key=bend_range strip=images/stitch/knob_0.png frames=64 ns=15 vs=22
knob cx=700 cy=237 r=38 label="VELOCITY" key=velocity strip=images/stitch/knob_0.png frames=64
knob cx=849 cy=237 r=38 label="SIGNATURE" key=signature strip=images/stitch/knob_0.png frames=64
knob cx=1097 cy=237 r=38 label="VOLUME" key=volume strip=images/stitch/knob_0.png frames=64
toggle cx=553 cy=246 label="LEGATO" key=legato
picture x=23 y=422 w=1214 h=258 key=model files="images/waves/model_0.svg,images/waves/model_1.svg,images/waves/model_2.svg,images/waves/model_3.svg" fit=stretch
qlinks "PLAY" = octave,fine,bend_range,-,legato,velocity,signature,-,volume,-,-,-

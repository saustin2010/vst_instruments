# Plaits skin, after the VCV Rack Plaits panel and Mutable Instruments' own panel artwork
# (plaits_v50.ai, CC-BY-SA 3.0 -- icons, chevron band and OUT/AUX lettering are taken from it; art/make_art.py
# builds images/bg.png from it, so keep the positions below in sync with that script).
#
# The real panel is one tall strip; here it's re-flowed for the wide MPC screen:
#   left   FREQUENCY over TIMBRE           right  HARMONICS over MORPH
#   centre the model icon/LED grid, turned sideways (teal row, LEDs, coral row), and under it the model name
#          between two round buttons, like the module's two model buttons (they step through the models; tap
#          the name for a list of all of them -- MPC's own double-tap picker opens empty for a VST2, see
#          mpc-vst-plugins docs/NOTES.md),
#          then the three attenuverters with the panel's -/+ marks and dotted links, and the OUT/AUX box.
# With MIDI note-on standing in for TRIG and no CV patched, the TIMBRE / FM / MORPH attenuverters set how much
# Plaits' internal decay envelope moves each one, as on the module. The other pages (VOICE, ENV, LFO, MATRIX)
# use images/bg_<page>.png from the same script: panel, title, band, and one outlined section per group.
# Knob filmstrips must stay <= 128 px per frame (2r+10): MPC garbles taller strips (16384 px image limit,
# docs/NOTES.md), so r <= 58 (the largest seen working). Knob names/values are MPC's own live labels (the param names in src/module.json).

style=plaits
art_css=mpcplaits.css
theme_bg=E8E8E6
theme_ink=231F20
theme_ink_dim=6E6B6C
theme_accent=03A3AC
theme_accent_hi=DB285E
theme_seg_active=03A3AC
theme_seg_inactive=DCDCD8
theme_seg_active_tx=FFFFFF
theme_lcd=F4F4F2
theme_line=BDBCBC
theme_btn_bg=231F20
theme_btn_text=FFFFFF
theme_box=656263
theme_display_ink=03A3AC


# Mutable Vibe MPC -- screen skin. Mutable-Instruments look (neutral light-grey panel, black knobs
# with white caps + white position line, thin faders with rectangular white caps, cyan/magenta
# accents), MPC system font (Titillium Web) baked. Pages: OVERVIEW / ENVELOPES / LFOS / EFFECTS / MOD.

theme_bg=d3d3d3
theme_panel=e0e0e0
theme_line=9c9c9c
theme_ink=1c1c1c
theme_ink_dim=5c5c5c
theme_ink_faint=919191
theme_accent=0a97ad
theme_accent_hi=b32e86
theme_knob_face=161616
theme_knob_ring=7e7e7e
theme_knob_dot=ffffff
theme_bar=c5c5c5
theme_tab_on=0a97ad
theme_tab_on_tx=ffffff
theme_btn_text=1b1c1d
theme_seg_active=0a97ad
theme_seg_inactive=c7c7c7
theme_seg_active_tx=ffffff
theme_lcd=eaeaea
art_css=mutablevibe.css
knob_look=moog
slider_look=fader
label_scale=1.5


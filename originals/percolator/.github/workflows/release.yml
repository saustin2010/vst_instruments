# Build a DRAFT release (tag v<version>) with mpc-vst-plugins' shared workflow: Actions -> "Release (draft)" -> Run
# workflow. Then install that draft's zip on a device, smoke-test it and publish the draft (mpc-vst-plugins
# docs/RELEASING.md). dry_run builds the zip and skin previews as run artifacts only.
# The tools come from saustin2010/mpc-vst-plugins (sd88me's repo plus changes offered to it) until they're merged there:
# then point uses: and tools_ref at sd88me/mpc-vst-plugins and drop tools_repo.
# This plugin is developed in saustin2010/vst_instruments (originals/percolator) and published here.
name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: saustin2010/mpc-vst-plugins/.github/workflows/vst-release.yml@eaef502c0a537605b73a0e2a78dfcbe66e45cf6c
    permissions:
      contents: write
    with:
      tag: v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_repo: saustin2010/mpc-vst-plugins
      tools_ref: eaef502c0a537605b73a0e2a78dfcbe66e45cf6c
      vst_dir: .
      build: bash "$MPC_VST/tools/build_port.sh" vst.json && rm -rf build/skin && mkdir -p build/skin && cp -R deploy/Synths/* build/skin/
      host_test: '"$MPC_VST/tools/test_port.sh" vst.json'
      user_data: percolator
      plugin_id: percolator
      license: MIT
      about: "Four-voice percussion synth laid out like the Erica Synths Pērkons HD-01, with envelope displays; it plays the Pērkons' free kit packs."
      dry_run: ${{ inputs.dry_run }}

  percolatorout:
    # percolatorout (percolatorout/) ships in this release as its own zip, with its own draft
    # (tag percolator-out-v<version>) and catalogue entry, as TR-MPC ships its Tap FX
    uses: saustin2010/mpc-vst-plugins/.github/workflows/vst-release.yml@eaef502c0a537605b73a0e2a78dfcbe66e45cf6c
    permissions:
      contents: write
    with:
      tag: percolator-out-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_repo: saustin2010/mpc-vst-plugins
      tools_ref: eaef502c0a537605b73a0e2a78dfcbe66e45cf6c
      vst_dir: percolatorout
      build: bash "$MPC_VST/tools/build_port.sh" percolatorout/vst.json && rm -rf percolatorout/build/skin && mkdir -p percolatorout/build/skin && cp -R percolatorout/deploy/Synths/* percolatorout/build/skin/
      host_test: '"$MPC_VST/tools/test_port.sh" percolatorout/vst.json'
      plugin_id: percolator-out
      license: MIT
      requires: Percolator 2.0.0 or later in the same project
      about: "Plays one of Percolator's OUT 1-4 on its own MPC track (an audio track will do), so a voice gets that track's fader, inserts and outputs."
      dry_run: ${{ inputs.dry_run }}

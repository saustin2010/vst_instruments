# Build a DRAFT release (tag v<version>) with mpc-vst-plugins' shared workflow: Actions -> "Release (draft)" -> Run
# workflow. Then install that draft's zip on a device, smoke-test it and publish the draft (mpc-vst-plugins
# docs/RELEASING.md). dry_run builds the zip and skin previews as run artifacts only.
# The tools come from saustin2010/mpc-vst-plugins (sd88me's repo plus changes offered to it) until they're merged there:
# then point uses: and tools_ref at sd88me/mpc-vst-plugins and drop tools_repo.
# This plugin is developed in saustin2010/vst_instruments (originals/stevequencer16) and published here.
name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: saustin2010/mpc-vst-plugins/.github/workflows/vst-release.yml@7afa72e35570be24b96b130f520e0cc871db38e1
    permissions:
      contents: write
    with:
      tag: v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_repo: saustin2010/mpc-vst-plugins
      tools_ref: 7afa72e35570be24b96b130f520e0cc871db38e1
      vst_dir: .
      build: bash "$MPC_VST/tools/build_port.sh" vst.json && rm -rf build/skin && mkdir -p build/skin && cp -R deploy/Synths/* build/skin/
      host_test: '"$MPC_VST/tools/test_port.sh" vst.json'
      plugin_id: stevequencer-16
      license: MIT
      about: "16 steps on a 4x4 grid and eight modulation lanes that can move any parameter of the instrument, on any page."
      dry_run: ${{ inputs.dry_run }}

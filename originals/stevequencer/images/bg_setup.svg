em">OUTPUT</text><text x="790" y="526" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">Port: [SEQ] Stevequencer</text><text x="790" y="546" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">MIDI Out. Pick it as an</text><text x="790" y="566" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">instrument track's</text><text x="790" y="586" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">MIDI input.</text><rect x="1032.5" y="16.5" width="231" height="595" rx="10" fill="#141619" stroke="#2a2f37" stroke-width="1"/><text x="1048" y="42" font-family="Titillium Web" font-size="13" font-weight="700" fill="#5f6873" text-anchor="start" dominant-baseline="central" letter-spacing="0.12em">PAGE</text><text x="1048" y="82" font-family="Titillium Web" font-size="46" font-weight="700" fill="#eef1f4" text-anchor="start" dominant-baseline="central" letter-spacing="0em">SETUP</text><text x="1048" y="126" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">Stevequencer makes no sound:</text><text x="1048" y="148" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">its notes leave through its</text><text x="1048" y="170" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">own MIDI port.</text><text x="1048" y="192" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em"></text><text x="1048" y="214" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">1. Menu &gt; Preferences &gt; MIDI:</text><text x="1048" y="236" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">   Track on for [SEQ]</text><text x="1048" y="258" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">   Stevequencer MIDI Out.</text><text x="1048" y="280" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">2. On the instrument's track:</text><text x="1048" y="302" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">   MIDI Input Port = that port,</text><text x="1048" y="324" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">   Monitor = In.</text><text x="1048" y="346" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">3. Press play: it follows</text><text x="1048" y="368" font-family="Titillium Web" font-size="15" font-weight="400" fill="#8d949c" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">   MPC's tempo.</text><rect x="1048" y="406" width="200" height="1" fill="#2a2f37"/><text x="1048" y="430" font-family="Titillium Web" font-size="13" font-weight="700" fill="#5f6873" text-anchor="start" dominant-baseline="central" letter-spacing="0.12em">NOW PLAYING</text></svg>

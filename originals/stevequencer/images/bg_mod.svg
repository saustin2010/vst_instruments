<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 628" width="1280" height="628"><rect x="0" y="0" width="1280" height="628" rx="0" fill="#101216"/><rect x="16.5" y="16.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><rect x="17" y="17" width="236" height="35" rx="9" fill="#1f2227"/><text x="28" y="34" font-family="Titillium Web" font-size="16" font-weight="700" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.04em">CC</text><text x="242" y="34" font-family="Titillium Web" font-size="12" font-weight="700" fill="#5f6873" text-anchor="end" dominant-baseline="central" letter-spacing="0.08em">MOD A</text><text x="135" y="137" font-family="Titillium Web" font-size="13" font-weight="400" fill="#5f6873" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CC 20 = 1ST Q-LINK</text><rect x="16.5" y="168.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><rect x="17" y="169" width="236" height="35" rx="9" fill="#1f2227"/><text x="28" y="186" font-family="Titillium Web" font-size="16" font-weight="700" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.04em">MODE</text><text x="242" y="186" font-family="Titillium Web" font-size="12" font-weight="700" fill="#5f6873" text-anchor="end" dominant-baseline="central" letter-spacing="0.08em">MOD A</text><text x="135" y="289" font-family="Titillium Web" font-size="13" font-weight="400" fill="#5f6873" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">EMPTY STEP: KEEP / BASE</text><rect x="16.5" y="320.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><rect x="17" y="321" width="236" height="35" rx="9" fill="#1f2227"/><text x="28" y="338" font-family="Titillium Web" font-size="16" font-weight="700" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.04em">BASE</text><text x="242" y="338" font-family="Titillium Web" font-size="12" font-weight="700" fill="#5f6873" text-anchor="end" dominant-baseline="central" letter-spacing="0.08em">MOD A</text><text x="135" y="441" font-family="Titillium Web" font-size="13" font-weight="400" fill="#5f6873" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">RETURN SENDS THIS</text><rect x="270.5" y="16.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><rect x="271" y="17" width="236" height="35" rx="9" fill="#1f2227"/><text x="282" y="34" font-family="Titillium Web" font-size="16" font-weight="700" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.04em">CC</text><text x="496" y="34" font-family="Titillium Web" font-size="12" font-weight="700" fill="#5f6873" text-anchor="end" dominant-baseline="central" letter-spacing="0.08em">MOD B</text><text x="389" y="137" font-family="Titillium Web" font-size="13" font-weight="400" fill="#5f6873" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CC 21 = 2ND Q-LINK</text><rect x="270.5" y="168.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><rect x="271" y="169" width="236" height="35" rx="9" fill="#1f2227"/><text x="282" y="186" font-family="Titillium Web" font-size="16" font-weight="700" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.04em">MODE</text><text x="496" y="186" font-family="Titillium Web" font-size="12" font-weight="700" fill="#5f6873" text-anchor="end" dominant-baseline="central" letter-spacing="0.08em">MOD B</text><text x="389" y="289" font-family="Titillium Web" font-size="13" font-weight="400" fill="#5f6873" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">EMPTY STEP: KEEP / BASE</text><rect x="270.5" y="320.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><rect x="271" y="321" width="236" height="35" rx="9" fill="#1f2227"/><text x="282" y="338" font-family="Titillium Web" font-size="16" font-weight="700" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.04em">BASE</text><text x="496" y="338" font-family="Titillium Web" font-size="12" font-weight="700" fill="#5f6873" text-anchor="end" dominant-baseline="central" letter-spacing="0.08em">MOD B</text><text x="389" y="441" font-family="Titillium Web" font-size="13" font-weight="400" fill="#5f6873" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">RETURN SENDS THIS</text><rect x="16.5" y="472.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><text x="28" y="502" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">Values per step: the</text><text x="28" y="524" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">1-16 MOD A Q-Link sub-page</text><text x="28" y="546" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">of each step page.</text><rect x="270.5" y="472.5" width="237" height="139" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><text x="282" y="502" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">Values per step: the</text><text x="282" y="524" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">1-16 MOD B Q-Link sub-page</text><text x="282" y="546" font-family="Titillium Web" font-size="15" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">of each step page.</text><rect x="524.5" y="16.5" width="491" height="595" rx="10" fill="#191c21" stroke="#2a2f37" stroke-width="1"/><text x="540" y="42" font-family="Titillium Web" font-size="13" font-weight="700" fill="#5f6873" text-anchor="start" dominant-baseline="central" letter-spacing="0.12em">PER-STEP MODULATION</text><text x="540" y="78" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">A step can carry a MOD A and a MOD B value (or - for</text><text x="540" y="102" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">none). At the step, each lane sends its value as a</text><text x="540" y="126" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">MIDI CC on MIDI CH, just before the step's note, and</text><text x="540" y="150" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">only when it changes. A lane plays on every step of</text><text x="540" y="174" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">the loop, with or without a note.</text><text x="540" y="198" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em"></text><text x="540" y="222" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">HOLD: a step without a value keeps the last one.</text><text x="540" y="246" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">RETURN: a step without a value sends BASE.</text><text x="540" y="270" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em"></text><text x="540" y="294" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">On this repo's instruments, CC 20-35 move the first</text><text x="540" y="318" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">page's Q-Links: CC 20-23 = column 1, top to bottom,</text><text x="540" y="342" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">24-27 = column 2, 28-31 = column 3, 32-35 = column 4.</text><text x="540" y="366" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">So CC 20 is the first knob (often the filter cutoff).</text><text x="540" y="390" font-family="Titillium Web" font-size="16" font-weight="400" fill="#a3abb5" text-anchor="start" dominant-baseline="central" letter-spacing="0.01em">Other instruments don't follow these CCs.</text><rect x="1032.5" y="16.5" width="231" height="595" rx="10" fill="#141619" stroke="#2a2f37" stroke-width="1"/><text x="1048" y="42" font-family="Titillium Web" font-size="13" font-weight="700" fill="#5f6873" text-anchor="start" dominant-baseline="central" letter-spacing="0.12em">PAGE</text><text x="1048" y="82" font-family="Titillium Web" font-size="46" font-weight="700" fill="#eef1f4" text-anchor="start" dominant-baseline="central" letter-spacing="0em">MOD</text><rect x="1048" y="406" width="200" height="1" fill="#2a2f37"/><text x="1048" y="430" font-family="Titillium Web" font-size="13" font-weight="700" fill="#5f6873" text-anchor="start" dominant-baseline="central" letter-spacing="0.12em">NOW PLAYING</text></svg>

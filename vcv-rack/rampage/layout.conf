# rampage for MPC, from the Stitch mockup steve/stitch_layouts/rampage.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
theme_accent=d0312d
theme_accent_hi=e8453f
theme_bg=c9cbcd
theme_box=e4e5e6
theme_ink=151515
theme_ink_dim=333538
theme_ink_faint=6a6d72
theme_knob_dot=d0312d
theme_knob_face=f4f4f2
theme_knob_ring=8d9095
theme_lcd=1b1c1f
theme_line=9a9da1
theme_panel=e4e5e6
theme_seg_active=d0312d
theme_seg_active_tx=ffffff
theme_seg_inactive=d4d6d8
art_css=rampage.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg

[tab RAMPAGE]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=289 cy=288 r=38 label="A RISE" key=rise_a strip=images/stitch/knob_0.png frames=64
knob cx=435 cy=288 r=38 label="A FALL" key=fall_a strip=images/stitch/knob_1.png frames=64 bw=115
knob cx=556 cy=292 r=31 label="A SHAPE" key=shape_a strip=images/stitch/knob_2.png frames=64 bw=115
knob cx=924 cy=288 r=38 label="B RISE" key=rise_b strip=images/stitch/knob_1.png frames=64
knob cx=1070 cy=288 r=38 label="B FALL" key=fall_b strip=images/stitch/knob_1.png frames=64 bw=115
knob cx=1191 cy=292 r=31 label="B SHAPE" key=shape_b strip=images/stitch/knob_2.png frames=64 bw=115
knob cx=428 cy=543 r=31 label="BALANCE" key=balance strip=images/stitch/knob_3.png frames=64
knob cx=1030 cy=554 r=32 label="VOLUME" key=volume strip=images/stitch/knob_4.png frames=64 bw=104
enum_h cx=536 cy=181 label="" key=range_a sw=74 sh=22 rows=2
enum_h cx=1171 cy=181 label="" key=range_b sw=74 sh=22 rows=2
toggle cx=270 cy=560 label="CYCLE A" key=cycle_a
toggle cx=587 cy=560 label="CYCLE B" key=cycle_b
toggle cx=915 cy=559 label="AUDIO" key=audio
button cx=108 cy=560 label="TRIG A" key=trig_a
button cx=749 cy=560 label="TRIG B" key=trig_b
qlinks "RAMPAGE" = range_a,rise_a,fall_a,shape_a,range_b,rise_b,fall_b,shape_b,cycle_a,balance,cycle_b,-,audio,volume,-,-

[tab MIDI]
art file=images/stitch/bg_1.png x=0 y=86 w=1280 h=628
knob cx=746 cy=245 r=32 label="CC CHANNEL" key=cc_channel strip=images/stitch/knob_5.png frames=64
knob cx=955 cy=245 r=32 label="CC OUT A" key=cc_a strip=images/stitch/knob_5.png frames=64
knob cx=1163 cy=245 r=32 label="CC OUT B" key=cc_b strip=images/stitch/knob_5.png frames=64
knob cx=200 cy=557 r=32 label="CC MIN" key=cc_min strip=images/stitch/knob_5.png frames=64
knob cx=445 cy=557 r=32 label="CC MAX" key=cc_max strip=images/stitch/knob_5.png frames=64
knob cx=955 cy=557 r=32 label="EOC NOTE A" key=eoc_note_a strip=images/stitch/knob_5.png frames=64
knob cx=1163 cy=557 r=32 label="EOC NOTE B" key=eoc_note_b strip=images/stitch/knob_5.png frames=64
enum_v cx=88 cy=253 label="" key=mode_a sw=84 sh=22
enum_v cx=244 cy=253 label="" key=mode_b sw=84 sh=22
toggle cx=401 cy=258 label="A KEY TRACK" key=keytrack_a
toggle cx=557 cy=258 label="B KEY TRACK" key=keytrack_b
toggle cx=746 cy=570 label="EOC NOTES" key=eoc_notes
qlinks "MIDI" = mode_a,mode_b,keytrack_a,keytrack_b,cc_channel,cc_a,cc_b,-,cc_min,cc_max,-,-,eoc_notes,eoc_note_a,eoc_note_b,-
